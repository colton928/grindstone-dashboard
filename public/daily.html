<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Grindstone – Daily Report</title>
  <style>
    :root {
      --orange:#E87722; --orange-dark:#c9631a; --charcoal:#1e1e1e;
      --dark-gray:#2a2a2a; --mid-gray:#3a3a3a; --text-light:#ffffff;
      --text-muted:#aaaaaa; --border:#444; --success:#4caf50; --radius:12px; --gap:20px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:var(--charcoal);color:var(--text-light);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:16px;min-height:100vh;padding-bottom:40px}
    .header{background:var(--orange);padding:14px 16px 12px;position:sticky;top:0;z-index:10;box-shadow:0 2px 12px rgba(0,0,0,.4);display:flex;align-items:center;gap:12px}
    .header-logo-img{width:44px;height:44px;flex-shrink:0;filter:invert(1);display:block}
    .header-center{flex:1;text-align:center}
    .header-company{font-size:19px;font-weight:800;letter-spacing:1px;color:#fff;text-transform:uppercase;line-height:1.1}
    .header-sub{font-size:12px;color:rgba(255,255,255,.85);margin-top:2px}
    .header-name{background:rgba(0,0,0,.2);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:700;letter-spacing:1px;color:#fff;white-space:nowrap;flex-shrink:0}
    .container{max-width:540px;margin:0 auto;padding:20px 16px}
    .card{background:var(--dark-gray);border-radius:var(--radius);padding:18px 16px;margin-bottom:var(--gap);border:1px solid var(--border)}
    .card-title{font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange);margin-bottom:14px;padding-bottom:10px;border-bottom:1px solid var(--border)}
    .field{margin-bottom:14px}.field:last-child{margin-bottom:0}
    label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px}
    select,input[type="number"],input[type="date"],input[type="text"],textarea{
      width:100%;background:var(--mid-gray);border:1.5px solid var(--border);border-radius:8px;
      color:var(--text-light);font-size:17px;padding:13px 14px;appearance:none;-webkit-appearance:none;
      outline:none;transition:border-color .2s;font-family:inherit}
    select:focus,input:focus,textarea:focus{border-color:var(--orange)}
    select option{background:#333;color:#fff}
    textarea{resize:none;line-height:1.5}
    .select-wrap{position:relative}
    .select-wrap::after{content:'▾';position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--orange);font-size:18px;pointer-events:none}
    .select-wrap select{padding-right:36px}
    input[type="number"]{text-align:center}
    .qty-label{text-align:center}
    .oneoff-input{margin-top:8px}
    .job-trigger{
      width:100%;background:var(--mid-gray);border:1.5px solid var(--border);border-radius:8px;
      color:var(--text-muted);font-size:17px;padding:13px 40px 13px 14px;cursor:pointer;
      display:flex;align-items:center;justify-content:space-between;user-select:none;
      transition:border-color .2s;position:relative;min-height:50px}
    .job-trigger:active{border-color:var(--orange)}
    .job-trigger.has-value{color:var(--text-light)}
    .job-trigger-text{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-right:10px}
    .job-trigger-arrow{color:var(--orange);font-size:18px;flex-shrink:0}
    .job-loading-dot{display:inline-block;animation:pulse 1.2s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    .work-row{display:grid;grid-template-columns:1fr 80px;gap:8px;align-items:start}
    .work-number{font-size:11px;font-weight:700;color:var(--orange);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}
    .work-item{margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--border)}
    .work-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
    .add-work-btn{width:100%;margin-top:4px;background:transparent;border:1.5px dashed var(--orange);border-radius:8px;color:var(--orange);font-size:14px;font-weight:700;padding:11px;cursor:pointer;letter-spacing:.5px;transition:background .15s}
    .add-work-btn:active{background:rgba(232,119,34,.12)}
    .remove-item-btn{background:none;border:none;color:var(--text-muted);font-size:17px;cursor:pointer;padding:0 2px 2px;line-height:1;flex-shrink:0}
    .remove-item-btn:active{color:#ff6b6b}
    .newtype-form{margin-top:10px;padding:14px;background:#1a1a1a;border:1px dashed var(--orange);border-radius:8px;display:none}
    .newtype-form.open{display:block}
    .newtype-row{display:grid;grid-template-columns:1fr 90px;gap:8px;margin-bottom:8px}
    .bill-toggle{display:flex;align-items:center;gap:14px;padding:4px 0}
    .toggle-switch{position:relative;width:54px;height:30px;flex-shrink:0}
    .toggle-switch input{opacity:0;width:0;height:0}
    .toggle-slider{position:absolute;inset:0;background:var(--mid-gray);border-radius:30px;cursor:pointer;transition:background .2s;border:1.5px solid var(--border)}
    .toggle-slider::before{content:'';position:absolute;width:22px;height:22px;left:3px;top:3px;background:#fff;border-radius:50%;transition:transform .2s}
    .toggle-switch input:checked+.toggle-slider{background:var(--orange);border-color:var(--orange)}
    .toggle-switch input:checked+.toggle-slider::before{transform:translateX(24px)}
    .toggle-label{font-size:16px;font-weight:600}
    .toggle-sub{font-size:12px;color:var(--text-muted);margin-top:2px}
    .btn-submit{width:100%;background:var(--orange);color:#fff;border:none;border-radius:var(--radius);font-size:18px;font-weight:700;padding:18px;cursor:pointer;letter-spacing:.5px;transition:background .15s,transform .1s;text-transform:uppercase;margin-top:4px}
    .btn-submit:active{background:var(--orange-dark);transform:scale(.98)}
    .btn-submit:disabled{background:#555;cursor:not-allowed;transform:none}
    #success-screen{display:none;text-align:center;padding:60px 20px}
    .success-icon{width:80px;height:80px;background:var(--success);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:40px;margin:0 auto 24px}
    .success-title{font-size:26px;font-weight:800;margin-bottom:10px}
    .success-sub{font-size:15px;color:var(--text-muted);margin-bottom:32px;line-height:1.5}
    .btn-new{background:var(--orange);color:#fff;border:none;border-radius:var(--radius);font-size:16px;font-weight:700;padding:16px 32px;cursor:pointer;text-transform:uppercase}
    .error-banner{display:none;background:#c0392b;color:#fff;border-radius:8px;padding:12px 14px;margin-bottom:16px;font-size:14px;line-height:1.5}
    .spinner{display:inline-block;width:20px;height:20px;border:3px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:8px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;display:none;opacity:0;transition:opacity .3s}
    .backdrop.open{display:block;opacity:1}
    .sheet{position:fixed;bottom:0;left:0;right:0;background:var(--dark-gray);border-radius:20px 20px 0 0;z-index:101;transform:translateY(100%);transition:transform .3s cubic-bezier(.4,0,.2,1);max-height:88vh;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
    .sheet.open{transform:translateY(0)}
    .sheet-handle{width:36px;height:4px;background:#555;border-radius:2px;margin:12px auto 0;flex-shrink:0}
    .sheet-header{padding:14px 16px 14px;border-bottom:1px solid var(--border);flex-shrink:0;display:flex;align-items:center;justify-content:space-between}
    .sheet-title{font-size:17px;font-weight:700}
    .sheet-close{background:none;border:none;color:var(--text-muted);font-size:22px;cursor:pointer;padding:0 4px;line-height:1}
    .sheet-search{padding:10px 16px 12px;border-bottom:1px solid var(--border);flex-shrink:0}
    .search-wrap{position:relative}
    .search-wrap input{width:100%;background:var(--mid-gray);border:1.5px solid var(--border);border-radius:10px;color:#fff;font-size:16px;padding:11px 14px 11px 40px;outline:none;font-family:inherit}
    .search-wrap input:focus{border-color:var(--orange)}
    .search-icon{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:16px;pointer-events:none}
    .job-list{overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
    .section-label{font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--orange);padding:14px 16px 6px}
    .job-item{padding:13px 16px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,.05);display:flex;align-items:center;gap:12px}
    .job-item:active,.job-item.selected{background:rgba(232,119,34,.12)}
    .job-icon{font-size:18px;flex-shrink:0;width:24px;text-align:center}
    .job-name{font-size:16px;font-weight:600;line-height:1.3}
    .job-meta{font-size:12px;color:var(--text-muted);margin-top:2px}
    .job-empty{text-align:center;color:var(--text-muted);padding:30px 20px;font-size:14px;line-height:1.6}
    .add-job-row{border-top:1px solid var(--border);padding:14px 16px;flex-shrink:0}
    .add-job-btn{width:100%;background:transparent;border:1.5px solid var(--orange);color:var(--orange);border-radius:10px;font-size:15px;font-weight:700;padding:13px;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
    .add-job-btn:active{background:rgba(232,119,34,.1)}
    .sheet-body{padding:16px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
    .sheet-field{margin-bottom:16px}.sheet-field:last-of-type{margin-bottom:20px}
    .sheet-label{display:block;font-size:13px;font-weight:600;color:var(--text-muted);margin-bottom:6px}
    .sheet-input{width:100%;background:var(--mid-gray);border:1.5px solid var(--border);border-radius:8px;color:#fff;font-size:17px;padding:13px 14px;outline:none;font-family:inherit}
    .sheet-input:focus{border-color:var(--orange)}
    .save-btn{width:100%;background:var(--orange);color:#fff;border:none;border-radius:10px;font-size:17px;font-weight:700;padding:16px;cursor:pointer;text-transform:uppercase}
    .save-btn:disabled{background:#555;cursor:not-allowed}
    .save-btn:active{background:var(--orange-dark)}
  </style>
</head>
<body>

<div class="backdrop" id="backdrop" onclick="closeAllSheets()"></div>

<!-- JOB SELECTOR SHEET -->
<div class="sheet" id="job-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title" id="t-select-job">Select Job</span>
    <button class="sheet-close" onclick="closeAllSheets()">✕</button>
  </div>
  <div class="sheet-search">
    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="job-search" oninput="filterJobs(this.value)" autocomplete="off" autocorrect="off" spellcheck="false">
    </div>
  </div>
  <div class="job-list" id="job-list">
    <div class="job-empty"><span class="job-loading-dot">●</span> …</div>
  </div>
  <div class="add-job-row">
    <button class="add-job-btn" id="t-add-job" onclick="openAddJobSheet()">+ Add New Job</button>
  </div>
</div>

<!-- ADD JOB SHEET -->
<div class="sheet" id="add-job-sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title" id="t-add-job-title">Add New Job</span>
    <button class="sheet-close" onclick="closeAllSheets()">✕</button>
  </div>
  <div class="sheet-body">
    <div class="sheet-field">
      <label class="sheet-label" id="t-job-name-lbl">Job Name</label>
      <input type="text" class="sheet-input" id="new-job-name">
    </div>
    <div class="sheet-field">
      <label class="sheet-label" id="t-city-lbl">City</label>
      <input type="text" class="sheet-input" id="new-job-city">
    </div>
    <div class="sheet-field">
      <label class="sheet-label" id="t-client-lbl">Client / Contractor</label>
      <input type="text" class="sheet-input" id="new-job-client">
    </div>
    <div class="sheet-field">
      <div class="bill-toggle">
        <label class="toggle-switch"><input type="checkbox" id="new-job-active" checked><span class="toggle-slider"></span></label>
        <div><div class="toggle-label" id="t-active-lbl">Active</div><div class="toggle-sub" id="t-active-sub">Show in job dropdown</div></div>
      </div>
    </div>
    <button class="save-btn" id="save-job-btn" onclick="saveNewJob()">Save Job</button>
  </div>
</div>

<!-- MAIN -->
<div class="container">
  <div id="form-section">
    <div class="error-banner" id="error-banner"></div>
    <form id="daily-form" novalidate>
      <div class="card">
        <div class="card-title" id="t-where">Where</div>
        <div class="field">
          <label for="report-date" id="t-date">Date</label>
          <input type="date" id="report-date" required>
        </div>
        <div class="field">
          <label id="t-job-loc">Job / Location</label>
          <div class="job-trigger" id="job-trigger" onclick="openJobSheet()">
            <span class="job-trigger-text" id="job-display">Select job / location...</span>
            <span class="job-trigger-arrow">▾</span>
          </div>
          <input type="hidden" id="job-value" name="job">
        </div>
      </div>

      <div class="card">
        <div class="card-title" id="t-work-today">Work Completed Today</div>
        <div id="work-items-container"></div>
        <button type="button" class="add-work-btn" id="add-work-btn" onclick="addWorkItem()">+ Add Work Type</button>
        <button type="button" class="add-work-btn" id="new-type-btn" style="display:none;margin-top:8px" onclick="toggleNewType()">+ New work type</button>
        <div class="newtype-form" id="newtype-form">
          <div class="newtype-row">
            <input type="text" id="nt-name" placeholder="New work type name">
            <div class="select-wrap"><select id="nt-unit"><option>EA</option><option>LF</option><option>SF</option></select></div>
          </div>
          <input type="text" id="nt-cat" placeholder="Category (optional, e.g. Sidewalk)" style="margin-bottom:8px">
          <button type="button" class="save-btn" id="nt-save" onclick="saveNewType()">Create work type</button>
        </div>
      </div>

      <div class="card">
        <div class="card-title" id="t-materials">Materials</div>
        <div class="field">
          <label for="concrete-yards" id="t-concrete">Concrete Ordered (yards)</label>
          <input type="number" id="concrete-yards" name="concreteYards" placeholder="0" min="0" step="0.5">
        </div>
      </div>

      <div class="card">
        <div class="card-title" id="t-notes">Notes</div>
        <div class="field">
          <label for="extra-notes" id="t-extra">Extra Work / Additional Info</label>
          <textarea id="extra-notes" name="extraNotes" rows="3"></textarea>
        </div>
        <div class="field">
          <label for="issues-delays" id="t-issues">Issues / Delays</label>
          <textarea id="issues-delays" name="issuesDelays" rows="3"></textarea>
        </div>
      </div>

      <div class="card">
        <div class="card-title" id="t-billing">Billing</div>
        <div class="bill-toggle">
          <label class="toggle-switch" for="ready-to-bill">
            <input type="checkbox" id="ready-to-bill" name="readyToBill">
            <span class="toggle-slider"></span>
          </label>
          <div>
            <div class="toggle-label" id="t-ready">Ready to Bill</div>
            <div class="toggle-sub" id="t-ready-sub">Mark this job phase as billable</div>
          </div>
        </div>
      </div>

      <button type="submit" class="btn-submit" id="submit-btn">Submit Report</button>
    </form>
  </div>

  <div id="success-screen">
    <div class="success-icon">✓</div>
    <div class="success-title" id="t-success">Report Submitted!</div>
    <div class="success-sub" id="success-detail"></div>
    <button class="btn-new" id="t-another" onclick="resetForm()">Submit Another</button>
  </div>
</div>

// ══ STATE ══
let allJobs = [], nearbyJobs = [], selectedJob = null, selectedClient = null;
let recentNames = JSON.parse(localStorage.getItem(KEY_RECENT) || '[]');

// ══ HELPERS ══
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
async function rpc(fn, body){
  const res = await fetch(SB_URL + '/rest/v1/rpc/' + fn, {
    method:'POST',
    headers:{ 'apikey':SB_KEY, 'Authorization':'Bearer '+SB_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(body || {})
  });
  if (!res.ok) throw new Error('RPC ' + fn + ' ' + res.status + ': ' + (await res.text()));
  return res.json();
}

// ══ WORK ITEMS ══
function workItemHTML(n){
  const head = n===1
    ? `<div class="work-number">${STR.item} 1</div>`
    : `<div class="work-number" style="display:flex;justify-content:space-between;align-items:center"><span>${STR.item} ${n} <span style="color:#666;font-weight:400;letter-spacing:0">(${STR.optional})</span></span><button type="button" class="remove-item-btn" onclick="removeWorkItem(${n})" title="Remove">✕</button></div>`;
  return `<div class="work-item" id="work-item-${n}">${head}
    <div class="work-row">
      <div><label for="work-type-${n}">${STR.workType}</label><div class="select-wrap"><select id="work-type-${n}"></select></div></div>
      <div><label class="qty-label" id="unit-label-${n}" for="qty-${n}">${STR.qty}</label><input type="number" id="qty-${n}" placeholder="0" min="0" step="any"></div>
    </div>
    <input type="text" id="oneoff-${n}" class="oneoff-input" style="display:none" placeholder="${STR.oneoffPh}">
  </div>`;
}
function buildWorkItems(){
  let h = '';
  for (let n=1; n<=workItemCount; n++) h += workItemHTML(n);
  document.getElementById('work-items-container').innerHTML = h;
  for (let n=1; n<=workItemCount; n++) initWorkSel(n);
}
function initWorkSel(n){
  const sel = document.getElementById('work-type-'+n);
  if (!sel) return;
  let h = (n===1) ? `<option value="">${STR.selectType}</option>` : `<option value="">— ${STR.none} —</option>`;
  WORK_TYPES.forEach(wt => {
    h += `<optgroup label="── ${esc(wt.g)} ──">`;
    wt.items.forEach(i => { h += `<option>${esc(i)}</option>`; });
    h += '</optgroup>';
  });
  h += `<optgroup label="──────"><option value="__oneoff__">${STR.oneoff}</option></optgroup>`;
  const prev = sel.value;
  sel.innerHTML = h;
  if (prev) sel.value = prev;
  const lbl = document.getElementById('unit-label-'+n);
  const oneoff = document.getElementById('oneoff-'+n);
  sel.onchange = function(){
    if (this.value === '__oneoff__'){
      if (oneoff) { oneoff.style.display='block'; oneoff.focus(); }
      if (lbl) { lbl.textContent = STR.qty; lbl.style.color = 'var(--orange)'; }
    } else {
      if (oneoff) oneoff.style.display='none';
      const unit = WORK_UNITS[this.value] || STR.qty;
      if (lbl) { lbl.textContent = unit; lbl.style.color = this.value ? 'var(--orange)' : ''; }
    }
  };
}
function addWorkItem(){
  if (workItemCount >= MAX_WORK_ITEMS) return;
  workItemCount++;
  const div = document.createElement('div');
  div.innerHTML = workItemHTML(workItemCount).trim();
  document.getElementById('work-items-container').appendChild(div.firstChild);
  initWorkSel(workItemCount);
  if (workItemCount >= MAX_WORK_ITEMS) document.getElementById('add-work-btn').style.display = 'none';
}
function removeWorkItem(n){
  const el = document.getElementById('work-item-'+n); if (el) el.remove();
  document.getElementById('add-work-btn').style.display = '';
}

// ══ NEW WORK TYPE (Colton only) ══
function toggleNewType(){ document.getElementById('newtype-form').classList.toggle('open'); }
async function saveNewType(){
  const name = document.getElementById('nt-name').value.trim();
  const unit = document.getElementById('nt-unit').value;
  const cat  = document.getElementById('nt-cat').value.trim();
  if (!name){ alert('Enter a work type name.'); return; }
  const btn = document.getElementById('nt-save'); btn.disabled = true;
  try {
    const item = await rpc('add_price_item', { p_name:name, p_category:cat||null, p_unit:unit });
    // reflect immediately
    WORK_UNITS[item.name] = item.unit;
    const g = item.category || 'Other';
    let grp = WORK_TYPES.find(w => w.g === g);
    if (!grp){ grp = { g, items:[] }; WORK_TYPES.push(grp); }
    if (!grp.items.includes(item.name)) grp.items.push(item.name);
    for (let n=1; n<=workItemCount; n++) initWorkSel(n);
    document.getElementById('nt-name').value=''; document.getElementById('nt-cat').value='';
    document.getElementById('newtype-form').classList.remove('open');
  } catch(e){ alert(String(e.message||e)); }
  finally { btn.disabled = false; }
}

// ══ WORK TYPES from price list ══
async function loadWorkTypes(){
  try {
    const rows = await rpc('get_work_types', {});
    if (Array.isArray(rows) && rows.length){
      const groups = [];
      const byCat = {};
      const units = {};
      rows.forEach(r => {
        const g = r.category || 'Other';
        if (!byCat[g]){ byCat[g] = { g, items:[] }; groups.push(byCat[g]); }
        byCat[g].items.push(r.name);
        units[r.name] = r.unit || 'EA';
      });
      WORK_TYPES = groups; WORK_UNITS = units;
      for (let n=1; n<=workItemCount; n++) initWorkSel(n);
    }
  } catch(e){ /* keep fallback list */ }
}

// ══ JOBS ══
async function loadJobs(){
  try {
    const rows = await rpc('get_active_jobs', {});
    allJobs = Array.isArray(rows) ? rows : [];
  } catch(e){ allJobs = []; }
  renderJobList();
}
function requestGeo(){
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(pos => {
    geoLat = pos.coords.latitude; geoLon = pos.coords.longitude; computeNearby();
  }, null, { timeout:6000, maximumAge:60000 });
}
function computeNearby(){
  if (geoLat === null) return;
  nearbyJobs = allJobs.filter(job => {
    const c = CITY_COORDS[(job.city||'').toLowerCase().trim()];
    if (!c) return false;
    return Math.sqrt(Math.pow(geoLat-c[0],2)+Math.pow(geoLon-c[1],2)) < 0.28;
  });
  renderJobList(document.getElementById('job-search').value);
}
function openJobSheet(){
  document.getElementById('job-sheet').classList.add('open');
  document.getElementById('backdrop').classList.add('open');
  document.body.style.overflow = 'hidden';
  document.getElementById('job-search').value = '';
  renderJobList('');
  setTimeout(() => document.getElementById('job-search').focus(), 350);
}
function openAddJobSheet(){
  document.getElementById('job-sheet').classList.remove('open');
  document.getElementById('add-job-sheet').classList.add('open');
  setTimeout(() => document.getElementById('new-job-name').focus(), 350);
}
function closeAllSheets(){
  document.getElementById('job-sheet').classList.remove('open');
  document.getElementById('add-job-sheet').classList.remove('open');
  document.getElementById('backdrop').classList.remove('open');
  document.body.style.overflow = '';
}
function filterJobs(q){ renderJobList(q); }
function renderJobList(filter = ''){
  const list = document.getElementById('job-list');
  const f = filter.toLowerCase().trim();
  const matches = j => !f || j.name.toLowerCase().includes(f) || (j.city||'').toLowerCase().includes(f) || (j.client||'').toLowerCase().includes(f);
  let html = '';
  if (!f && nearbyJobs.length){
    html += `<div class="section-label">${STR.nearby}</div>`;
    nearbyJobs.forEach(job => html += jobItemHTML(job, '📍'));
  }
  const validRecent = recentNames.filter(n => allJobs.some(j => j.name === n));
  if (!f && validRecent.length){
    html += `<div class="section-label">${STR.recent}</div>`;
    validRecent.forEach(name => { const job = allJobs.find(j=>j.name===name); if (job) html += jobItemHTML(job,'🕐'); });
  }
  const filtered = allJobs.filter(matches);
  if (filtered.length === 0){
    html += `<div class="job-empty">${STR.noMatch} "<strong>${esc(filter)}</strong>"</div>`;
  } else {
    if (!f) html += `<div class="section-label">${STR.allActive}</div>`;
    filtered.forEach(job => html += jobItemHTML(job, '🏗'));
  }
  list.innerHTML = html;
  list.querySelectorAll('.job-item').forEach(el => {
    el.addEventListener('click', () => selectJob(el.dataset.name, el.dataset.city, el.dataset.client));
  });
}
function jobItemHTML(job, icon){
  const sel = selectedJob === job.name ? ' selected' : '';
  return `<div class="job-item${sel}" data-name="${esc(job.name)}" data-city="${esc(job.city||'')}" data-client="${esc(job.client||'')}">
    <div class="job-icon">${icon}</div>
    <div><div class="job-name">${esc(job.name)}</div><div class="job-meta">${esc(job.city||'')}${job.client ? ' · '+esc(job.client) : ''}</div></div>
  </div>`;
}
function selectJob(name, city, client){
  selectedJob = name; selectedClient = client || null;
  document.getElementById('job-value').value = name;
  const display = document.getElementById('job-display');
  display.textContent = name;
  document.getElementById('job-trigger').classList.add('has-value');
  closeAllSheets();
  recentNames = [name, ...recentNames.filter(n => n !== name)].slice(0, 3);
  localStorage.setItem(KEY_RECENT, JSON.stringify(recentNames));
}

// ══ ADD JOB ══
async function saveNewJob(){
  const name = document.getElementById('new-job-name').value.trim();
  const city = document.getElementById('new-job-city').value.trim();
  const client = document.getElementById('new-job-client').value.trim();
  const active = document.getElementById('new-job-active').checked;
  if (!name){ alert(STR.jobName); return; }
  const btn = document.getElementById('save-job-btn'); btn.disabled = true;
  try {
    await rpc('add_field_job', { p_name:name, p_city:city, p_client:client, p_status: active ? 'active' : 'inactive' });
    const job = { name, city, client, status: active ? 'active':'inactive' };
    allJobs.push(job);
    ['new-job-name','new-job-city','new-job-client'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('new-job-active').checked = true;
    closeAllSheets();
    selectJob(name, city, client);
  } catch(e){ alert(String(e.message||e)); }
  finally { btn.disabled = false; }
}

// ══ SUBMIT ══
document.getElementById('daily-form').addEventListener('submit', async function(e){
  e.preventDefault();
  const errBanner = document.getElementById('error-banner');
  errBanner.style.display = 'none';
  const job = document.getElementById('job-value').value;
  if (!job){ showError(STR.errJob); return; }

  const items = [];
  for (let n=1; n<=MAX_WORK_ITEMS; n++){
    const sel = document.getElementById('work-type-'+n);
    if (!sel) continue;
    const qtyEl = document.getElementById('qty-'+n);
    const qty = qtyEl ? Number(qtyEl.value) : 0;
    let productName = sel.value;
    let unit = WORK_UNITS[productName] || '';
    if (productName === '__oneoff__'){
      const off = document.getElementById('oneoff-'+n);
      productName = off ? off.value.trim() : '';
      unit = '';
    }
    if (!productName || !qty) continue;
    items.push({ product_name: productName, quantity: qty, unit: unit });
  }
  if (!items.length){ showError(STR.errWork); return; }

  const payload = {
    job_name: job,
    log_date: document.getElementById('report-date').value || null,
    submitted_by: SUBMITTER,
    client: selectedClient || null,
    concrete_yards: document.getElementById('concrete-yards').value ? Number(document.getElementById('concrete-yards').value) : null,
    notes: document.getElementById('extra-notes').value || null,
    issues_delays: document.getElementById('issues-delays').value || null,
    ready_to_bill: document.getElementById('ready-to-bill').checked,
    items: items
  };

  const btn = document.getElementById('submit-btn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>' + STR.submitting;
  try {
    await rpc('sync_daily_log', { payload: payload });
    showSuccess(items.length);
  } catch(err){
    showError(String(err.message || err));
    btn.disabled = false; btn.textContent = STR.submit;
  }
});

function showError(msg){
  const b = document.getElementById('error-banner');
  b.textContent = msg; b.style.display = 'block';
  window.scrollTo({ top:0, behavior:'smooth' });
}
function showSuccess(n){
  document.getElementById('form-section').style.display = 'none';
  document.getElementById('success-detail').textContent = STR.submitted(n);
  document.getElementById('success-screen').style.display = 'block';
  window.scrollTo({ top:0, behavior:'smooth' });
}
function resetForm(){
  document.getElementById('daily-form').reset();
  document.getElementById('report-date').value = new Date().toISOString().split('T')[0];
  document.getElementById('job-display').textContent = STR.selectJobPh;
  document.getElementById('job-trigger').classList.remove('has-value');
  document.getElementById('job-value').value = '';
  selectedJob = null; selectedClient = null;
  workItemCount = 3; buildWorkItems();
  document.getElementById('add-work-btn').style.display = '';
  const btn = document.getElementById('submit-btn'); btn.disabled = false; btn.textContent = STR.submit;
  document.getElementById('success-screen').style.display = 'none';
  document.getElementById('form-section').style.display = 'block';
}
